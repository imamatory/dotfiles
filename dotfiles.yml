---
- hosts: all
  tasks:

    - name: Zsh
      file:
        src: "{{ playbook_dir }}/files/zshrc_common"
        dest: ~/.zshrc
        force: yes
        state: link

    - name: Mise config
      file:
        path: ~/.config/mise
        state: directory

    - name: Mise
      file:
        src: "{{ playbook_dir }}/files/mise.toml"
        dest: ~/.config/mise/config.toml
        force: yes
        state: link

    - name: Neovim
      file:
        dest: ~/.config/nvim
        force: yes
        state: directory

    - name: Tmux
      file:
        src: "{{ playbook_dir }}/files/tmux.conf"
        dest: ~/.tmux.conf
        force: yes
        state: link

    - name: Alacritty config
      file:
        src: "{{ playbook_dir }}/files/alacritty.toml"
        dest: ~/.alacritty.toml
        force: yes
        state: link

    - name: Tig
      file:
        src: "{{ playbook_dir }}/files/tigrc"
        dest: ~/.tigrc
        state: link
        force: yes

    - name: Git
      file:
        src: "{{ playbook_dir }}/files/gitconfig"
        dest: ~/.gitconfig
        state: link
        force: yes

    - file:
        path: ~/.config/gitui
        state: directory
        force: yes

    - name: Gitui key bindings
      file:
        src: "{{ playbook_dir }}/files/gitui-key-bindings.ron"
        dest: ~/.config/gitui/key_bindings.ron
        state: link
        force: yes

    - name: Gitui theme
      get_url:
        url: https://raw.githubusercontent.com/catppuccin/gitui/main/themes/catppuccin-frappe.ron
        dest: ~/.config/gitui/theme.ron
        force: yes

    - name: Starship
      file:
        src: "{{ playbook_dir }}/files/starship.toml"
        dest: ~/.config/starship.toml
        state: link
        force: yes

    - file:
        path: ~/.config/ghostty
        state: directory
        force: yes

    - name: Ghostty config
      file:
        src: "{{ playbook_dir }}/files/ghostty/config.ghostty"
        dest: ~/.config/ghostty/config.ghostty
        state: link
        force: yes

    - file:
        path: ~/.config/opencode
        state: directory
        force: yes

    - name: OpenCode CLI config
      file:
        src: "{{ playbook_dir }}/files/opencode/cli.json"
        dest: ~/.config/opencode/cli.json
        state: link
        force: yes

    - name: OpenCode config
      file:
        src: "{{ playbook_dir }}/files/opencode/opencode.json"
        dest: ~/.config/opencode/opencode.json
        state: link
        force: yes

    - name: SSH config
      file:
        src: "{{ playbook_dir }}/files/ssh_config"
        dest: ~/.ssh/config
        state: link
        force: yes
