---
- hosts: all
  vars:
    config: ~/.bash_profile
  tasks:

    - name: Remove empty ~/.config/nvim directory (safe, only if empty)
      ansible.builtin.command: rmdir ~/.config/nvim
      failed_when: false
      changed_when: true

    - file:
        src: "{{ playbook_dir }}/nvim"
        dest: ~/.config/nvim
        state: link
